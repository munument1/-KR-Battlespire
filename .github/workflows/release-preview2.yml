name: Build and publish Battlespire Preview 2
on:
  push:
    branches: [main]
    paths:
      - 'release_components/**'
      - 'build_preview2_from_components.py'
      - '.github/workflows/release-preview2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: battlespire-preview2-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'munument1/-KR-Battlespire'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Recreate delta-only Preview 2 payload
        run: >
          python build_preview2_from_components.py
          --baseline assets/korean-patch.zip
          --components release_components
          --output assets/korean-patch-preview2.zip
      - name: Synthetic installer and Steam launcher tests
        run: python -m unittest discover -s tests -v
      - name: Use tested Preview 2 payload
        shell: pwsh
        run: |
          Move-Item -LiteralPath assets/korean-patch-preview2.zip -Destination assets/korean-patch.zip -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/korean-patch.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update delta-only payload to Steam Preview 2"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Cannot push verified binary to main" }
          }
      - name: Build standalone Windows executable
        run: >
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name BattlespireKoreanPatcher
          --add-data "assets;assets"
          --add-data "licenses;licenses"
          patcher.py
      - name: Package installer with checksum
        shell: pwsh
        run: |
          New-Item -Type Directory -Force -Path release-contents | Out-Null
          Copy-Item dist/BattlespireKoreanPatcher.exe release-contents/
          Copy-Item README.md release-contents/
          Copy-Item LICENSE release-contents/
          $name = 'BattlespireKoreanPatcher-0.1.0-preview2-Windows-x64.zip'
          Compress-Archive -Path release-contents/* -DestinationPath "dist/$name" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
      - name: Publish Preview 2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >
          gh release create v0.1.0-preview2
          dist/BattlespireKoreanPatcher-0.1.0-preview2-Windows-x64.zip
          dist/SHA256SUMS.txt
          --prerelease
          --target main
          --title "배틀스파이어 한국어 패처 0.1.0 Preview 2"
          --notes-file RELEASE_PREVIEW2.md
